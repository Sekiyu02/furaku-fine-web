<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン｜株式会社富楽ファイン</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-tagu.svg">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #0a0f14;
      color: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      opacity: 0.6;
    }
    .offline-title {
      font-family: "Noto Serif JP", serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }
    .offline-message {
      color: rgba(245, 240, 235, 0.6);
      margin-bottom: 3rem;
      line-height: 2;
      font-size: 0.9rem;
    }
    .offline-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      border: 1px solid #f5f0eb;
      color: #f5f0eb;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      background: transparent;
      transition: all 0.3s ease;
    }
    .offline-button:hover {
      background: #E67635;
      border-color: #E67635;
      color: #0a0f14;
    }
  </style>
</head>
<body>
  <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M8.5 2H15.5C16.9045 2 17.6067 2 18.1111 2.33706C18.3295 2.48298 18.517 2.67048 18.6629 2.88886C19 3.39331 19 4.09554 19 5.5V18C19 19.8856 19 20.8284 18.4142 21.4142C17.8284 22 16.8856 22 15 22H9C7.11438 22 6.17157 22 5.58579 21.4142C5 20.8284 5 19.8856 5 18V5.5C5 4.09554 5 3.39331 5.33706 2.88886C5.48298 2.67048 5.67048 2.48298 5.88886 2.33706C6.39331 2 7.09554 2 8.5 2Z"/>
    <path d="M12 18H12.01"/>
    <path d="M2 2L22 22" stroke-linecap="round"/>
  </svg>
  <h1 class="offline-title">インターネット接続がありません</h1>
  <p class="offline-message">
    ネットワーク接続を確認して、<br>
    再度お試しください。
  </p>
  <button class="offline-button" onclick="window.location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    再読み込み
  </button>
</body>
</html>
