  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('articleContainer');
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      if (!articleId) {
        container.innerHTML = `
          <div class="error-message">
            <p>記事が見つかりませんでした。</p>
            <a href="knowledge.html" class="article-back">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              ナレッジ一覧に戻る
            </a>
          </div>
        `;
        return;
      }

      const article = await getKnowledgeById(articleId);

      if (!article) {
        container.innerHTML = `
          <div class="error-message">
            <p>記事の取得に失敗しました。</p>
            <a href="knowledge.html" class="article-back">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              ナレッジ一覧に戻る
            </a>
          </div>
        `;
        return;
      }

      const categoryNames = {
        recruitment: '採用ブランディング',
        philosophy: '理念浸透',
        organization: '組織開発',
        medical: '医療採用',
        case: '事例紹介',
        column: 'COLUMN',
        report: 'REPORT',
        news: 'NEWS'
      };

      // タイトルを設定
      document.title = `${article.title} | 富楽ファイン ナレッジ`;

      // OGPとcanonicalを動的に設定
      const canonicalUrl = `https://furakufine.co.jp/article?id=${articleId}`;

      function updateMeta(property, content, isOgp = true) {
        const attr = isOgp ? 'property' : 'name';
        let meta = document.querySelector(`meta[${attr}="${property}"]`);
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute(attr, property);
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', content);
      }

      updateMeta('og:title', `${article.title} | 富楽ファイン ナレッジ`);
      updateMeta('og:description', article.excerpt || article.title);
      updateMeta('og:url', canonicalUrl);
      if (article.thumbnail) {
        updateMeta('og:image', article.thumbnail.url);
      }
      updateMeta('description', article.excerpt || article.title, false);

      let canonical = document.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = document.createElement('link');
        canonical.setAttribute('rel', 'canonical');
        document.head.appendChild(canonical);
      }
      canonical.setAttribute('href', canonicalUrl);

      // 記事コンテンツを表示
      container.innerHTML = `
        <div class="article-info">
          <span class="article-category">${categoryNames[article.category] || article.category || 'COLUMN'}</span>
          <h1 class="article-title">${article.title}</h1>
          <p class="article-date">${new Date(article.publishDate || article.publishedAt || article.createdAt).toLocaleDateString('ja-JP')}</p>
        </div>

        ${article.thumbnail ? `
          <div class="article-thumbnail">
            <img src="${article.thumbnail.url}" alt="${article.title}">
          </div>
        ` : ''}

        <div class="article-content">
          ${article.content || '<p>本文がありません。</p>'}
        </div>

        <a href="knowledge.html" class="article-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          ナレッジ一覧に戻る
        </a>
      `;
    });
  </script>
